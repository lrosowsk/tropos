<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// Soft, harmonious palette: body / cap / ink
const P = {
  foundation:  { name: "Foundation", line: "Daily Multivitamin", dose: "30 SERVINGS · 60 CAPSULES", shape: "bottle", body: "#efefed", cap: "#e2e2e0", ink: "#1b1b1b" },
  omega:       { name: "Omega",      line: "EPA + DHA Fish Oil", dose: "30 SERVINGS · 60 SOFTGELS", shape: "bottle", body: "#d3d3d1", cap: "#c4c4c2", ink: "#1d1d1d" },
  creatine:    { name: "Creatine",   line: "Micronized Monohydrate", dose: "60 SERVINGS · 300 G", shape: "tub", body: "#f1f1ef", cap: "#1d1d1d", ink: "#1b1b1b" },
  magnesium:   { name: "Magnesium",  line: "Bisglycinate Chelate", dose: "30 SERVINGS · 60 CAPSULES", shape: "bottle", body: "#a7a7a5", cap: "#989896", ink: "#151515" },
  ashwagandha: { name: "Calm",       line: "Ashwagandha Root Extract", dose: "30 SERVINGS · 60 CAPSULES", shape: "bottle", body: "#bdbdbb", cap: "#adadab", ink: "#181818" },
  protein:     { name: "Protein",    line: "Grass-Fed Whey Isolate", dose: "30 SERVINGS · 900 G", shape: "tub", body: "#1e1e1e", cap: "#2a2a2a", ink: "#eeeeec" },
  hydrate:     { name: "Hydrate",    line: "Electrolyte Drink Mix", dose: "30 SERVINGS · 30 STICKS", shape: "tub", body: "#d9d9d7", cap: "#1d1d1d", ink: "#1c1c1c" },
  rest:        { name: "Rest",       line: "Glycine · Theanine · Apigenin", dose: "30 SERVINGS · 90 CAPSULES", shape: "bottle", body: "#3b3b3b", cap: "#2f2f2f", ink: "#ececea" },
  focus:       { name: "Focus",      line: "Caffeine + L-Theanine", dose: "30 SERVINGS · 30 CAPSULES", shape: "bottle", body: "#171717", cap: "#232323", ink: "#efefed" },
};

const qs = new URLSearchParams(location.search);
const W = +qs.get("w") || 1000, H = +qs.get("h") || 1250;
await document.fonts.load('400 100px "Fraunces"');
await document.fonts.load('600 40px "Inter"');
await document.fonts.load('500 40px "Inter"');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.82;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

scene.add(new THREE.HemisphereLight(0xffffff, 0xd6d6d6, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(-5, 13, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8; key.shadow.camera.right = 8; key.shadow.camera.top = 8; key.shadow.camera.bottom = -8;
key.shadow.radius = 22; key.shadow.blurSamples = 32; key.shadow.bias = -0.0004;
scene.add(key);
const fill = new THREE.DirectionalLight(0xf2f5ff, 0.3);
fill.position.set(6, 3, 4);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.8);
rim.position.set(2, 5, -6);
scene.add(rim);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.2 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* Label printed directly on the container: transparent canvas wrapped on a cylinder slice */
function labelTexture(p, arcW, bandH) {
  const cw = 2048, ch = Math.round(cw * bandH / arcW);
  const c = document.createElement("canvas"); c.width = cw; c.height = ch;
  const g = c.getContext("2d");
  g.fillStyle = p.ink; g.textAlign = "center"; g.textBaseline = "alphabetic";
  const cx = cw / 2, u = ch / 100; // vertical unit
  g.font = `600 ${7.2 * u}px Inter`;
  if ("letterSpacing" in g) g.letterSpacing = `${2.4 * u}px`;
  g.fillText("TROPOS", cx + 1.2 * u, 16 * u);
  if ("letterSpacing" in g) g.letterSpacing = "0px";
  const nameSize = p.name.length > 8 ? 21 : 24;
  g.font = `300 ${nameSize * u}px Fraunces`;
  g.fillText(p.name, cx, 50 * u);
  g.globalAlpha = 0.5; g.fillRect(cx - 9 * u, 58 * u, 18 * u, 0.35 * u); g.globalAlpha = 1;
  g.font = `500 ${6.4 * u}px Inter`;
  g.globalAlpha = 0.9; g.fillText(p.line, cx, 71 * u);
  g.font = `500 ${4.4 * u}px Inter`;
  if ("letterSpacing" in g) g.letterSpacing = `${0.9 * u}px`;
  g.globalAlpha = 0.6; g.fillText(p.dose, cx, 90 * u);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function satin(color, rough = 0.55) {
  return new THREE.MeshPhysicalMaterial({ color, envMapIntensity: 0.55, roughness: rough, metalness: 0, clearcoat: 0.2, clearcoatRoughness: 0.45, sheen: 0.2, sheenRoughness: 0.8, sheenColor: new THREE.Color(0xffffff) });
}

function capMesh(p, r, h, y) {
  const grp = new THREE.Group();
  const ridgeTex = (() => {
    const c = document.createElement("canvas"); c.width = 1024; c.height = 4;
    const g = c.getContext("2d");
    for (let x = 0; x < 1024; x++) { const v = Math.round(128 + 127 * Math.sin((x / 1024) * Math.PI * 2 * 90)); g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x, 0, 1, 4); }
    const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping; t.anisotropy = 16; t.minFilter = THREE.LinearMipmapLinearFilter; return t;
  })();
  const m = satin(p.cap, 0.62);
  m.bumpMap = ridgeTex; m.bumpScale = 0.12;
  const side = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 160, 1, true), m);
  side.position.y = y + h / 2;
  const top = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.985, r, 0.04, 160), satin(p.cap, 0.6));
  top.position.y = y + h;
  // small rounded edge on top
  const edge = new THREE.Mesh(new THREE.TorusGeometry(r * 0.985, 0.025, 16, 160), satin(p.cap, 0.6));
  edge.rotation.x = Math.PI / 2; edge.position.y = y + h;
  [side, top, edge].forEach(o => { o.castShadow = true; grp.add(o); });
  return grp;
}

function makeBottle(p) {
  const grp = new THREE.Group();
  const R = 1, Hb = 2.5, neckR = 0.6;
  // profile (x = radius, y = height) with rounded base and soft shoulder
  const pts = [];
  pts.push(new THREE.Vector2(0, 0));
  for (let i = 0; i <= 8; i++) { const a = -Math.PI / 2 + (i / 8) * Math.PI / 2; pts.push(new THREE.Vector2(R - 0.12 + 0.12 * Math.cos(a), 0.12 + 0.12 * Math.sin(a))); }
  pts.push(new THREE.Vector2(R, Hb - 0.55));
  for (let i = 1; i <= 16; i++) { const t = i / 16; const x = R - (R - neckR) * (1 - Math.cos(t * Math.PI / 2)) ; const y = Hb - 0.55 + 0.55 * Math.sin(t * Math.PI / 2); pts.push(new THREE.Vector2(x, y)); }
  pts.push(new THREE.Vector2(neckR, Hb + 0.12));
  pts.push(new THREE.Vector2(0, Hb + 0.12));
  const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 200), satin(p.body));
  body.castShadow = true; body.receiveShadow = true;
  grp.add(body);
  // label band
  const L = 1.9, y0 = 0.45, y1 = 1.85;
  const lab = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.003, R + 0.003, y1 - y0, 200, 1, true, -L / 2, L),
    new THREE.MeshPhysicalMaterial({ map: labelTexture(p, R * L, y1 - y0), transparent: true, roughness: 0.7, depthWrite: false }));
  lab.position.y = (y0 + y1) / 2;
  grp.add(lab);
  grp.add(capMesh(p, 0.66, 0.62, Hb + 0.05));
  return grp;
}

function makeTub(p) {
  const grp = new THREE.Group();
  const R = 1.32, Hb = 1.55;
  const pts = [new THREE.Vector2(0, 0)];
  for (let i = 0; i <= 8; i++) { const a = -Math.PI / 2 + (i / 8) * Math.PI / 2; pts.push(new THREE.Vector2(R - 0.1 + 0.1 * Math.cos(a), 0.1 + 0.1 * Math.sin(a))); }
  pts.push(new THREE.Vector2(R, Hb));
  pts.push(new THREE.Vector2(R - 0.04, Hb + 0.04));
  pts.push(new THREE.Vector2(0, Hb + 0.04));
  const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 220), satin(p.body));
  body.castShadow = true; body.receiveShadow = true;
  grp.add(body);
  const L = 1.55, y0 = 0.18, y1 = 1.42;
  const lab = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.003, R + 0.003, y1 - y0, 220, 1, true, -L / 2, L),
    new THREE.MeshPhysicalMaterial({ map: labelTexture(p, R * L, y1 - y0), transparent: true, roughness: 0.7, depthWrite: false }));
  lab.position.y = (y0 + y1) / 2;
  grp.add(lab);
  grp.add(capMesh(p, R + 0.05, 0.48, Hb));
  return grp;
}

const aoTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d");
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, "rgba(20,20,20,.55)"); gr.addColorStop(.55, "rgba(20,20,20,.22)"); gr.addColorStop(1, "rgba(20,20,20,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
function withContact(obj, r) {
  const ao = new THREE.Mesh(new THREE.PlaneGeometry(r * 2.7, r * 2.7), new THREE.MeshBasicMaterial({ map: aoTex, transparent: true, depthWrite: false, toneMapped: false }));
  ao.rotation.x = -Math.PI / 2; ao.position.y = 0.002;
  obj.add(ao);
  return obj;
}
const make = id => withContact((P[id].shape === "tub" ? makeTub : makeBottle)(P[id]), P[id].shape === "tub" ? 1.32 : 1);

const camera = new THREE.PerspectiveCamera(22, W / H, 0.1, 100);
const mode = qs.get("mode") || "single";
if (mode === "single") {
  const id = qs.get("id");
  const obj = make(id);
  scene.add(obj);
  const h = P[id].shape === "tub" ? 2.05 : 3.2;
  camera.position.set(0, h * 0.62 + 1.3, 14.5);
  camera.lookAt(0, h * 0.47, 0);
} else {
  // group composition
  const layout = [
    ["creatine",   -5.05, -0.2],
    ["focus",      -2.35,  0.2],
    ["foundation",  0,     0.45],
    ["magnesium",   2.35,  0.2],
    ["protein",     5.05, -0.2],
  ];
  for (const [id, x, z] of layout) { const o = make(id); o.position.set(x, 0, z); o.lookAt(0.15 + (o.position.x - 0.15) * 0.0, 0, 26);  scene.add(o); }
  camera.fov = 20;
  camera.position.set(0, 4.2, 27);
  camera.lookAt(0, 1.3, 0);
}
camera.updateProjectionMatrix();
renderer.render(scene, camera);
window.__done = true;
</script>
